[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swara"
version = "0.1.0"
description = "Indic text-to-speech accessibility app for blind and low-vision students, wrapping AI4Bharat's open TTS models."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Dhanush Shankar", email = "danushankar3@gmail.com" }]
requires-python = ">=3.10"
keywords = ["tts", "accessibility", "ai4bharat", "indic", "text-to-speech"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Adaptive Technologies",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
parler = ["transformers>=4.40", "torch>=2.2", "soundfile>=0.12"]
pdf = ["pypdf>=4.0"]

[project.scripts]
swara = "app.main:run"

[project.urls]
Homepage = "https://github.com/dhanush-shankar/swara"
Repository = "https://github.com/dhanush-shankar/swara"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-q"
